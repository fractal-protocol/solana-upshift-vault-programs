name: Dependency audit

# One definition, two triggers: ci.yml calls it on every PR/push, and the cron
# reruns it daily so an advisory published against an unchanged lockfile is
# caught without waiting for the next PR.
on:
    workflow_call:
    schedule:
        - cron: "41 4 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    cargo:
        name: cargo-audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
              with:
                  tool: cargo-audit
            # cargo-audit reads .cargo/audit.toml from the directory it runs in, so each
            # workspace keeps its own ignore list; the root one (programs) is strictest.
            # The first run fetches the advisory DB; the rest reuse it.
            - name: Programs (root workspace)
              run: cargo audit
            - name: Integration tests
              working-directory: integration-tests
              run: cargo audit --no-fetch
            - name: Generated clients
              working-directory: clients/rust
              run: |
                  for lock in */Cargo.lock; do
                    cargo audit --no-fetch --file "$lock"
                  done

    npm:
        name: pnpm audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
            # Runtime deps only: devDependencies never see untrusted input.
            # Ignored in package.json (pnpm.auditConfig.ignoreGhsas), none with an in-major fix:
            #   GHSA-3gc7-fjrx-p6mg  bigint-buffer, via spl-token. Reachable from RPC account
            #                        decoding (deploy scripts too); no patched release exists.
            #   GHSA-82x6-q7mm-w9cf, GHSA-v5mp-jgw5-2x6j, GHSA-4qx8-w7c3-pj3p,
            #   GHSA-9j65-hcg3-gc64, GHSA-9qmh-m7c6-f92p
            #                        toml 3.x, via @coral-xyz/anchor. Parses only our Anchor.toml.
            - name: pnpm audit (prod, high+)
              run: pnpm audit --prod --audit-level=high
