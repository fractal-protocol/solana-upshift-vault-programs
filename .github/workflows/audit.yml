name: Dependency audit

# One definition, two triggers: ci.yml calls it on every PR/push, and the cron
# reruns it daily so an advisory published against an unchanged lockfile is
# caught without waiting for the next PR.
on:
    workflow_call:
    schedule:
        - cron: "41 4 * * *"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    cargo:
        name: cargo-audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
              with:
                  tool: cargo-audit
            # Each workspace has its own lockfile and its own ignore list, read
            # from .cargo/audit.toml in the directory audit runs from. The root
            # list covers the on-chain programs and is the strictest.
            - name: Programs (root workspace)
              run: cargo audit
            - name: Integration tests
              working-directory: integration-tests
              run: cargo audit
            - name: Generated clients
              working-directory: clients/rust
              run: |
                  cargo audit --file august-vault/Cargo.lock
                  cargo audit --file august-withdrawal-queue/Cargo.lock

    npm:
        name: pnpm audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"
            # Runtime deps only: devDependencies (mocha, codama, prettier) never
            # see untrusted input. Ignored GHSAs live in package.json
            # (pnpm.auditConfig). toml only parses our own Anchor.toml inside
            # @coral-xyz/anchor. bigint-buffer IS reachable: spl-token decodes RPC
            # account data with it, deploy scripts included. It has no patched
            # release, so it stays ignored until spl-token drops it; use a
            # trusted RPC endpoint for deploys.
            - name: pnpm audit (prod, high+)
              run: pnpm audit --prod --audit-level=high
