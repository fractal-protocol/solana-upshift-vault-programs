# cargo-audit configuration
#
# All ignored advisories below are informational warnings (unmaintained /
# unsound) reported against TRANSITIVE dependencies pulled in by the Solana
# SDK and SPL crates via `anchor-lang` / `anchor-spl` / `mpl-token-metadata`.
# None of them are exploitable vulnerabilities in this on-chain program, and
# none can be fixed at the application level — they will be resolved by
# upstream Solana releases. Re-evaluate this list each time we bump Anchor or
# Solana, and remove any entry whose underlying crate version is no longer in
# Cargo.lock.
#
# Enforced by the `security` job in .github/workflows/ci.yml.

[advisories]
ignore = [
    # bincode 1.3.3: unmaintained. Pulled in by the entire SPL stack for
    # on-chain serialization. Awaiting Solana SDK migration to bincode 2.x.
    "RUSTSEC-2025-0141",

    # libsecp256k1 0.6.0: unmaintained. Pulled in by solana-program for
    # secp256k1 recovery in the SDK. Awaiting upstream replacement.
    "RUSTSEC-2025-0161",

    # rand 0.7.3 + rand 0.8.5: unsound interaction between `rand::rng()` and
    # a custom global logger. Not exercised by our on-chain program (rand is
    # only used in SDK host-side helpers, never on-chain). Pulled in via
    # curve25519-dalek and solana-program.
    "RUSTSEC-2026-0097",
]
