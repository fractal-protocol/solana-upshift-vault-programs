# Separate workspace from the program crate — see root Cargo.toml's `exclude`
# block for context. Run tests with:
#     anchor build && cargo test --manifest-path integration-tests/Cargo.toml
[workspace]
resolver = "2"

# This workspace is excluded from the root one, so it does not inherit the root
# manifest's `overflow-checks`. Tests assert on balance deltas with plain `-`;
# without this, `cargo test --release` would wrap a negative delta instead of
# failing, and an invariant test could pass on a reversed transfer.
[profile.release]
overflow-checks = true

[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# In-process LiteSVM tests for the August vault program.
#
# These tests load `target/deploy/august_vault.so` directly into a LiteSVM
# instance and exercise the program without a `solana-test-validator`. They run
# under `cargo test` in milliseconds and are parallel-safe (each test gets its
# own SVM).
#
# Run the tests with:
#     cargo test --manifest-path integration-tests/Cargo.toml
#
# No separate `anchor build` needed: build.rs runs the SBF build first, because
# cargo has no dependency edge from these tests to the program's artifact
# (separate workspaces) and a stale one would be tested silently and pass. This
# does require the SBF toolchain (`cargo-build-sbf`, from the Solana CLI). See
# build.rs for the reasoning and the ALLOW_STALE_PROGRAM_SO escape hatch, which
# skips the build to test a hand-placed artifact.

[lib]
path = "src/lib.rs"

[dependencies]
august-vault = { path = "../programs/august-vault", features = ["no-entrypoint"] }
august-withdrawal-queue = { path = "../programs/august-withdrawal-queue", features = ["no-entrypoint"] }
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
# 0.18 is the first line that runs SBPFv3 bytecode. It speaks the Solana 3/4
# types, while everything else here (anchor 0.31, spl, solana-sdk) is on 2.x;
# src/svm.rs converts at that one boundary, which is all the crates below are for.
litesvm = "0.18.1"
solana-account-v4 = { package = "solana-account", version = "4.3" }
solana-address-v2 = { package = "solana-address", version = "2.7" }
solana-transaction-v4 = { package = "solana-transaction", version = "4.1", features = ["serde"] }
solana-transaction-error-v3 = { package = "solana-transaction-error", version = "3.4", features = ["serde"] }
bincode = "1"
serde = "1"
# Same major as the program crate's dependency; provides the program ID and
# account deserializers for the share-token-metadata tests.
mpl-token-metadata = "5.1.1"
solana-sdk = "2.2.1"
spl-token = "8.0.0"
spl-token-2022 = "8.0.1"
spl-associated-token-account = "6"
# Decodes `Program data:` logs so the harness can hand tests their emitted events.
base64 = "0.21"

[dev-dependencies]
proptest = "1"
test-case = "3.3.1"
