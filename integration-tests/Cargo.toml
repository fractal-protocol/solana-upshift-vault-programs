# Separate workspace from the program crate — see root Cargo.toml's `exclude`
# block for context. Run tests with:
#     anchor build && cargo test --manifest-path integration-tests/Cargo.toml
[workspace]
resolver = "2"

# This workspace is excluded from the root one, so it does not inherit the root
# manifest's `overflow-checks`. Tests assert on balance deltas with plain `-`;
# without this, `cargo test --release` would wrap a negative delta instead of
# failing, and an invariant test could pass on a reversed transfer.
[profile.release]
overflow-checks = true

[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# In-process LiteSVM tests for the August vault program.
#
# These tests load `target/deploy/august_vault.so` directly into a LiteSVM
# instance and exercise the program without a `solana-test-validator`. They run
# under `cargo test` in milliseconds and are parallel-safe (each test gets its
# own SVM).
#
# Build the program first:
#     anchor build
#
# Then:
#     cargo test --manifest-path integration-tests/Cargo.toml
#
# The first step is not optional and is machine-enforced: cargo has no dependency
# edge from these tests to the program's SBF artifact (separate workspaces), so a
# stale artifact would be tested silently and pass. build.rs fails the build if any
# source the SBF build actually read (per its own dep-info) has changed since it ran.
# See build.rs for the reasoning and the ALLOW_STALE_PROGRAM_SO escape hatch.

[lib]
path = "src/lib.rs"

[dependencies]
august-vault = { path = "../programs/august-vault", features = ["no-entrypoint"] }
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
litesvm = "0.7.1"
# Same major as the program crate's dependency; provides the program ID and
# account deserializers for the share-token-metadata tests.
mpl-token-metadata = "5.1.1"
solana-sdk = "2.2.1"
spl-token = "8.0.0"
spl-token-2022 = "8.0.1"
spl-associated-token-account = "6"

[dev-dependencies]
proptest = "1"
test-case = "3.3.1"
