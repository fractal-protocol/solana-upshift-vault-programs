[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
august_vault = "C8B1EpsSGVWK2vMrk3aDT3kL7RCE77otokUh4EC35kK7"

[programs.localnet]
august_vault = "up12bytoZBmwofqsySf2uqKQ7zpfeKiAWwfvqzJjtRt"

[programs.mainnet]
august_vault = "up12bytoZBmwofqsySf2uqKQ7zpfeKiAWwfvqzJjtRt"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "/tmp/deployer_keypair.json"

[test]
# solana-test-validator sometimes needs longer than Anchor's 5000ms default to
# produce its first blockhash on a busy CI runner, yielding a spurious "Test
# validator does not look started" failure. startup_wait is a MAX wait — Anchor
# proceeds the instant the validator is ready — so raising it only extends the
# give-up deadline and adds no delay on the normal (fast-boot) path.
startup_wait = 20000

[scripts]
cei-pattern = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/1_*.ts tests/11_redeem_cei_pattern.ts"
close-vault = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/12_*.ts"
multi-vault = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/11_*.ts"
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/1_*.ts tests/2_*.ts tests/3_*.ts tests/11_*.ts tests/12_*.ts tests/13_*.ts"
version-security = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/13_*.ts"
