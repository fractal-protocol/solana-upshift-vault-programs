[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
august_vault = "C8B1EpsSGVWK2vMrk3aDT3kL7RCE77otokUh4EC35kK7"

[programs.localnet]
august_vault = "up12bytoZBmwofqsySf2uqKQ7zpfeKiAWwfvqzJjtRt"

[programs.mainnet]
august_vault = "up12bytoZBmwofqsySf2uqKQ7zpfeKiAWwfvqzJjtRt"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "/tmp/deployer_keypair.json"

[scripts]
cei-pattern = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/1_*.ts tests/11_redeem_cei_pattern.ts"
close-vault = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/12_*.ts"
multi-vault = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/11_*.ts"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/1_*.ts tests/2_*.ts tests/3_*.ts tests/11_*.ts tests/12_*.ts tests/13_*.ts"
version-security = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/13_*.ts"
