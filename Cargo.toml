[workspace]
members = [
    "programs/*",
]
# `integration-tests/` and `clients/rust/august-vault/` are intentionally
# separate workspaces — their transitive dep graphs (litesvm, codama-generated
# code) pull in crates that require a newer `cargo` than the SBF toolchain
# bundles. Keeping the main workspace lean lets `anchor build` resolve cleanly.
exclude = [
    "integration-tests",
    "clients/rust/august-vault",
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
