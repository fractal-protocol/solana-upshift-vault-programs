# Separate workspace from the program crate so generated code's deps don't
# constrain the SBF build. Build with:
#     cargo build --manifest-path clients/rust/august-vault/Cargo.toml
[workspace]
resolver = "2"

[package]
name = "august-vault-client"
version = "0.1.0"
edition = "2021"
description = "Generated Rust client for the august-vault program. Regenerate via `pnpm run generate-clients`."
publish = false

# Generated by Codama from target/idl/august_vault.json. Do not edit
# `src/generated/` by hand — regenerate it from the IDL instead.

# Only the feature sets whose dependencies are actually wired are exposed.
# The generated source also carries `serde`, `fetch`, and `anchor-idl-build`
# cfg-gated code paths; those features are intentionally NOT declared here
# because their backing crates (serde_with / Pubkey serde, solana-client,
# anchor-lang) are not taken as dependencies. Leaving them undeclared keeps
# `cargo check --all-features` green; wire the deps here first if you ever
# need to enable one.
[features]
default = []
solana-sdk = ["dep:solana-sdk"]

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
solana-account = "2.2"
solana-account-info = "2.2"
solana-cpi = "2.2"
solana-instruction = "2.2"
solana-program-error = "2.2"
solana-pubkey = { version = "2.2", features = ["borsh"] }
solana-sdk = { version = "2.2.1", optional = true }
num-derive = "0.4"
num-traits = "0.2"
thiserror = "2.0"

[lints.rust]
# This crate is fully generated by Codama. Its output carries cfg-gated code
# paths for optional integrations we don't wire (serde / fetch / anchor /
# anchor-idl-build) plus unavoidable unused imports. Register those feature
# cfgs as expected values and allow the unused warnings so `-D warnings`
# checks stay green without hand-editing generated code.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde", "fetch", "anchor", "anchor-idl-build"))'] }
unused = "allow"
