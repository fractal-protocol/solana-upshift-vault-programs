# Separate workspace from the program crate so generated code's deps don't
# constrain the SBF build. Build with:
#     cargo build --manifest-path clients/rust/august-vault/Cargo.toml
[workspace]
resolver = "2"

[package]
name = "august-vault-client"
version = "0.1.0"
edition = "2021"
description = "Generated Rust client for the august-vault program. Regenerate via `pnpm run generate-clients`."
publish = false

# Generated by Codama from target/idl/august_vault.json. Do not edit
# `src/generated/` by hand — regenerate it from the IDL instead.

[features]
default = []
serde = ["dep:serde"]
solana-sdk = ["dep:solana-sdk"]
# Reserved feature names referenced in generated source — declare them so
# `cfg`-attribute checks don't warn. The `fetch` codepath references
# `solana_client::rpc_client::RpcClient`; no in-repo consumer enables it, so
# we don't take the dependency. If you ever need it, add
#   solana-client = { version = "2.2", optional = true }
# and gate fetch via `fetch = ["dep:solana-client"]`.
anchor-idl-build = []
fetch = []

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
solana-account = "2.2"
solana-account-info = "2.2"
solana-cpi = "2.2"
solana-instruction = "2.2"
solana-program-error = "2.2"
solana-pubkey = { version = "2.2", features = ["borsh"] }
serde = { version = "1.0", features = ["derive"], optional = true }
solana-sdk = { version = "2.2.1", optional = true }
num-derive = "0.4"
num-traits = "0.2"
thiserror = "2.0"
